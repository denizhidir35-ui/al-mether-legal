<!doctype html>
<html lang="tr">

  <title>METHER UETS</title>

  <style>
    body {

      margin: 0;
      padding: 14px;
      background: #0b1220;
      color: #f8fafc;
      font-family: Arial,sans-serif;
    }

    strong {
      display: block;
      margin-bottom: 5px;
      color: #f3cf7a;

    }

    p {
      margin: 0 0 12px;
      color: #94a3b8;

      line-height: 1.5;
    }

      width: 100%;
      height: 34px;
      margin-top: 6px;
      border: 1px solid #334155;
      border-radius: 8px;

      color: #e2e8f0;
      cursor: pointer;
    }

    button.active {
      border-color: #d2a94f;
      color: #f3cf7a;
    }

      margin-top: 10px;
      color: #86efac;

    UETS oturumu browser içinde kalır.

  <button id="local">
    Localhost kullan
  </button>

  <button id="prod">
    Vercel production kullan

  <button id="testBridge">

<div id="status"></div>
